<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="alternate" type="application/rss+xml" title="tangkk Daily Brief" href="/daily-brief/feed.xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>{{ page.title }} | tangkk Daily Brief</title>
  <style>
    :root { --fg:#111; --muted:#667085; --line:#e7e7e7; --link:#0b57d0; --soft:#fafafa; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--fg); background:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; font-size:16px; line-height:1.76; }
    a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
    .page { max-width:900px; margin:0 auto; padding:30px 18px 56px; }
    .nav { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; margin-bottom:34px; }
    .kicker { margin:0 0 8px; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font-size:34px; line-height:1.2; letter-spacing:-.025em; }
    .date { margin:10px 0 28px; color:var(--muted); font-size:14px; padding-bottom:20px; border-bottom:1px solid var(--line); }
    article h2 { margin:34px 0 10px; font-size:23px; line-height:1.35; }
    article h3 { margin:24px 0 8px; font-size:18px; }
    article p { margin:10px 0; }
    article strong { font-weight:650; }
    article blockquote { margin:18px 0; padding:1px 16px; border-left:3px solid var(--line); color:#333; }
    article code { background:var(--soft); padding:2px 5px; border-radius:4px; }
    .footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
    @media (max-width:640px) { .page{padding:20px 14px 40px;} h1{font-size:28px;} article h2{font-size:21px;} }
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav"><a href="/">← Home</a><a href="/daily-brief/">Daily Brief archive</a><a href="/daily-brief/feed.xml">RSS</a></nav>
    <header><p class="kicker">tangkk · Daily Brief</p><h1>{{ page.title }}</h1><p class="date">{{ page.date | date: "%Y-%m-%d" }}</p></header>
    <article>{{ content }}</article>
    <footer class="footer">Daily Brief · AI, semiconductors, markets, world, China and science.</footer>
  </main>
</body>
</html>
